<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/webp" href="images/smile_Ramona.webp">
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀계약 시뮬레이터</title>

    <script src="config/config.js?v=design-system-20260831-10"></script>
    <script>
        CONFIG.VERSION = 'covenant-layout-20261115-49';
        loadCSS('css/common.css');
        loadCSS('css/components.css');
        loadCSS('css/toast.css');
        loadJS('js/toast.js');
        loadCSS('css/pages/covenant_simulator.css');
        loadCSS('css/covenant-editor.css');
        loadCSS('css/pages/covenant-workspace.css');
        loadCSS('css/responsive.css');
        loadJS('js/feedback.js');
    </script>
</head>

<body>
<div class="bg-image"></div>
<div class="background-overlay"></div>

<main class="container covenant-page">
    <div class="header-area">
        <nav aria-label="탐색"><a href="index.html" class="back-link">← 돌아가기</a></nav>
    </div>

    <section class="covenant-shell" aria-label="비밀계약 시뮬레이터">
        <div class="covenant-summary">
            <h2>비밀계약 시뮬레이터</h2><button type="button" id="covenant-help" aria-label="사용 방법 다시 보기" title="사용 방법" disabled>?</button>
        </div>

        <section class="simulator-panel" aria-label="시뮬레이션 모드">
            <div class="chrome-tabs-container simulator-tabs">
                <div class="tab-buttons" role="tablist" aria-label="시뮬레이션 모드">
                    <button type="button" class="chrome-tab active" data-mode-tab="editor" role="tab" aria-selected="true" aria-controls="editor-panel">세팅·프리셋</button>
                    <button type="button" class="chrome-tab" data-mode-tab="manual" role="tab" aria-selected="false" aria-controls="manual-panel">전사</button>
                    <button type="button" class="chrome-tab" data-mode-tab="target" role="tab" aria-selected="false" aria-controls="target-panel">목표 시뮬레이션</button>
                </div>
                <div class="capture-actions">
                    <button type="button" id="reset-sim-btn" class="ghost-action">시뮬레이션 초기화</button>
                    <button type="button" class="floating-report-btn simulator-report ghost-action" aria-label="버그 제보하기">버그 제보</button>
                </div>
            </div>

            <p id="storage-status" class="workspace-help" role="status" aria-live="polite"></p>
            <div id="editor-panel" class="mode-panel" role="tabpanel" aria-label="세팅·프리셋">
                    <div class="preset-controls" aria-label="프리셋 관리">
                        <input type="text" id="preset-name-input" class="preset-name-input" placeholder="프리셋 이름" aria-label="프리셋 이름">
                        <select id="preset-select" class="sim-select preset-select" aria-label="저장된 프리셋"></select>
                        <button type="button" id="save-preset-btn" class="ghost-action">프리셋 저장</button>
                        <button type="button" id="load-preset-btn" class="ghost-action">불러오기</button>
                        <button type="button" id="delete-preset-btn" class="ghost-action">삭제</button>
                    </div>

                <p id="preset-status" class="workspace-help" role="status" aria-live="polite"></p>
                <div id="shared-covenant-editor" aria-label="비밀계약 6부위 편집"></div>
            </div>
            <div id="manual-panel" class="mode-panel hidden" role="tabpanel" aria-label="전사">
                <div class="transcription-workspace">
                    <div id="manual-part-buttons" class="simulator-contract-visual" role="group" aria-label="전사할 비밀계약 부위"></div>
                    <div class="simulator-side-panel">
                    <div class="transcription-detail" role="region" aria-label="선택한 부위 전사">
                        <div class="transcription-detail-scroll">
                            <div class="transcription-current-head"><h3 id="transcription-current-title"></h3><label class="simulator-binding">귀속<input type="checkbox" role="switch" class="member-binding-switch" data-simulator-bound="manual" aria-label="비밀계약 전체 귀속"></label><button type="button" id="edit-transcription-part" class="ghost-action">세팅 편집</button></div>
                            <section class="simulator-preset-import" aria-label="비밀계약 세팅 불러오기"><h3>비밀계약 세팅 불러오기</h3><div class="preset-import-controls"><select class="sim-select" data-equipment-preset="manual" aria-label="전사에 불러올 비밀계약 세팅"></select><button type="button" class="ghost-action" data-import-preset="manual">불러오기</button></div><p data-import-status="manual" role="status"></p></section>
                            <p id="transcription-current-main" class="workspace-help"></p>
                            <div class="transcription-comparison">
                                <section aria-label="현재 부위 옵션"><div id="transcription-current-stats" class="transcription-current-stats"></div></section>
                                <div id="manual-result" class="result-list empty-result" hidden>—</div>
                            </div>
                            <div class="reroll-completion-row" aria-live="polite">
                                <div class="completion-panel"><span class="completion-label">전사 전</span><strong id="manual-before-completion">0%</strong></div>
                                <div class="completion-panel"><span class="completion-label">전사 후</span><strong id="manual-after-completion">-</strong></div>
                            </div>
                            <div id="manual-transcription" class="transcription-cost-controls">
                                <h4 id="manual-part-title" hidden>전사</h4>
                                <span id="manual-cost" class="workspace-help"></span>
                                <input type="radio" name="manual-lock-cost" value="fragment" checked hidden><input type="radio" name="manual-lock-cost" value="quill" hidden><div class="resource-priority"><span data-priority-label="fragment">잔본</span><button type="button" role="switch" aria-checked="false" aria-label="전사 깃펜 우선" data-resource-switch="manual"><span aria-hidden="true"></span></button><span data-priority-label="quill">깃펜</span></div>
                            </div>
                        </div>
                        <div class="action-row workspace-footer">
                            <span id="manual-status" class="manual-status" role="status" aria-live="polite"></span>
                            <button type="button" id="manual-reroll-btn" class="primary-action">전사</button>
                            <button type="button" id="manual-apply-btn" class="ghost-action" disabled>교체</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>

            <div id="target-panel" class="mode-panel hidden" role="tabpanel" aria-label="목표 시뮬레이션">
                <div class="target-toolbar target-contract-toolbar">
                    <div id="target-scope-buttons" class="simulator-contract-visual" role="group" aria-label="목표 시뮬레이션 대상 부위"></div>
                    <div class="simulator-side-panel">
                    <div class="target-contract-controls" role="region" aria-label="목표 편집">
                        <section id="target-setting-import" class="simulator-preset-import" aria-labelledby="target-setting-import-title">
                            <h3 id="target-setting-import-title">비밀계약 세팅 불러오기</h3>
                            <div class="preset-import-controls"><select class="sim-select" data-equipment-preset="target" aria-label="목표에 불러올 비밀계약 세팅"></select><button type="button" class="ghost-action" data-import-preset="target">불러오기</button></div>
                            <p data-import-status="target" role="status"></p>
                        </section>
                        <div class="target-editor-heading">
                        <div id="target-editor-part-buttons" class="target-editor-part-buttons" role="group" aria-label="편집할 대상 부위"></div>
                        <label class="simulator-binding">귀속<input type="checkbox" role="switch" class="member-binding-switch" data-simulator-bound="target" aria-label="비밀계약 전체 귀속"></label>
                        <div class="target-editor-tabs" role="tablist" aria-label="목표 편집 항목">
                            <button type="button" id="target-current-tab" data-target-editor-view="current" role="tab" aria-label="현재 부옵" aria-controls="target-current-section" aria-selected="false">현재</button>
                            <button type="button" id="target-goals-tab" data-target-editor-view="goals" role="tab" aria-label="목표 조건" aria-controls="target-goals-section" aria-selected="true">목표</button>
                        </div>
                        </div>

                        <div class="target-controls-scroll">
                            <section id="target-current-section" role="tabpanel" aria-labelledby="target-current-tab" hidden>
                                <button type="button" id="target-change-covenant" class="ghost-action">비밀계약 변경</button>
                                <div id="target-current-parts" class="target-parts"></div>
                            </section>
                            <section id="target-goals-section" role="tabpanel" aria-labelledby="target-goals-tab"><div id="target-parts" class="target-parts"></div></section>

                        </div>
                        <div class="target-actions workspace-footer">
                            <select id="target-lock-cost" hidden aria-label="잠금 비용"><option value="fragment" selected>잔본 우선</option><option value="quill">깃펜 우선</option></select><div class="resource-priority"><span data-priority-label="fragment">잔본</span><button type="button" role="switch" aria-checked="false" aria-label="목표 깃펜 우선" data-resource-switch="target"><span aria-hidden="true"></span></button><span data-priority-label="quill">깃펜</span></div>
                            <button type="button" id="run-target-btn" class="primary-action">시뮬레이션</button><button type="button" id="stop-target-btn" class="ghost-action" hidden>중단</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="capture-panel" aria-label="시뮬레이션 결과">
            <div class="result-summary-card">
                <div class="section-heading">
                    <h3 id="result-title">능력치</h3>
                    <span id="result-status" class="result-status" role="status" aria-live="polite"></span>
                </div>
                <div id="result-summary" class="summary-output"></div>
            </div>
        </section>
        <section id="simulator-ability-panel" class="simulator-ability-panel" aria-label="비밀계약 능력치" hidden>
            <h3 id="ability-title">비밀계약 능력치</h3><div id="ability-summary"></div>
        </section>
    </section>
</main>

        <dialog id="manual-setting-dialog" aria-labelledby="manual-setting-title"><div class="section-heading"><h2 id="manual-setting-title">전사 세팅</h2><button type="button" id="close-manual-settings">닫기</button></div><div id="manual-covenant-editor"></div></dialog>
        <dialog id="covenant-set-dialog" aria-labelledby="covenant-picker-title"><div class="section-heading"><h2 id="covenant-picker-title">비밀계약 선택</h2><button type="button" id="close-covenant-set-picker" aria-label="비밀계약 선택 닫기">닫기</button></div>
            <div class="section-heading">
                <span id="selected-contract-name" class="muted-text"></span>
            </div>
            <div id="contract-grid" class="contract-grid" aria-label="비밀계약 목록"></div>
        </dialog>


<div id="contract-change-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="contract-change-title">
    <div class="modal-content contract-change-content">
        <h2 id="contract-change-title" class="form-title">비밀계약 변경</h2>
        <p class="contract-change-message">
            현재 세팅이 프리셋으로 저장되지 않았습니다. 저장하지 않고 비밀계약을 변경할까요?
        </p>
        <div class="contract-change-actions">
            <button type="button" id="cancel-contract-change-btn" class="ghost-action">취소</button>
            <button type="button" id="confirm-contract-change-btn" class="primary-action">변경하기</button>
        </div>
    </div>
</div>



<dialog id="covenant-tour" aria-labelledby="covenant-tour-title" aria-describedby="covenant-tour-description">
    <div id="covenant-tour-spotlight" aria-hidden="true"></div>
    <section id="covenant-tour-card">
        <div class="tour-top"><span id="covenant-tour-progress"></span><button type="button" id="covenant-tour-skip">건너뛰기</button></div>
        <h2 id="covenant-tour-title"></h2><p id="covenant-tour-description"></p>
        <div class="tour-actions"><button type="button" id="covenant-tour-previous">이전</button><button type="button" id="covenant-tour-next" class="primary-action">다음</button></div>
    </section>
</dialog>
<script src="js/covenant-picker.js"></script>
<script>
    loadJS('js/covenant-onboarding.js');
    loadJS('js/covenant_simulator.js');
</script>
</body>
</html>
