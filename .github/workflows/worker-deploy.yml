name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'workers/**'
      - 'wrangler.jsonc'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DZONE_INGEST_TOKEN: ${{ secrets.DZONE_INGEST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test Worker
        run: node --test workers/feedback-worker.test.cjs

      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DZONE_INGEST_TOKEN"

      - name: Sync D-Zone ingest secret
        shell: bash
        run: printf '%s' "$DZONE_INGEST_TOKEN" | npx --yes wrangler@4.129.0 secret put DZONE_INGEST_TOKEN

      - name: Deploy Worker
        run: npx --yes wrangler@4.129.0 deploy
