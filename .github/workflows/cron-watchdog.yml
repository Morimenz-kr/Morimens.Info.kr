name: Monitor Worker Cron

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-cron-watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the latest completed cron heartbeat
        env:
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${WATCHDOG_TOKEN}" \
            https://carriepigeon.khj613401.workers.dev/cron-watchdog
