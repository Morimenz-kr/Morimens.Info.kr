name: Monitor Worker Cron

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-cron-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the verified main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and automatically recover the Worker cron
        env:
          WATCHDOG_URL: https://carriepigeon.khj613401.workers.dev/cron-watchdog
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TRIGGER_RECOVERY_WAIT_SECONDS: '720'
          WORKER_RECOVERY_WAIT_SECONDS: '720'
          RECOVERY_POLL_SECONDS: '30'
          UNAVAILABLE_CONFIRMATION_SECONDS: '30'
        run: node tools/cron-auto-recovery.mjs
