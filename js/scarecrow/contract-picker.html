<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages/covenant_simulator.css"><link rel="stylesheet" href="css/responsive.css"><title>비밀계약 선택</title><style>
body{margin:0;background:#1b1b1e;color:#eee8dc}
main{padding:.75rem;min-width:0}
.simulator-panel{padding:.5rem;border:0;background:transparent;box-shadow:none}
.section-heading{margin-bottom:.5rem}
.section-heading h3{display:none}
#selected-contract-name{font-size:.85rem;overflow-wrap:anywhere}
.contract-grid{max-height:none;overflow:visible;gap:.5rem;padding:0}
.contract-card{min-height:5.25rem;padding:.4rem .3rem;border-radius:4px;gap:.25rem;align-content:center}
.contract-card img{width:4rem;height:3rem;object-fit:contain;max-width:100%}
.contract-card-name{font-size:.8rem;line-height:1.25;overflow-wrap:anywhere}
.contract-card.active{border-color:#caa15a!important;background:#363027!important}
#contract-preview{margin-top:.65rem;border-top:1px solid #494237;padding-top:.4rem;font-size:.8rem;line-height:1.5;color:#ccc4b5}
#contract-preview:empty{display:none}
#contract-preview p{margin:.25rem 0;overflow-wrap:anywhere}
.contract-picker-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.5rem;margin-top:.6rem}
button{min-height:44px}
.primary-action{background:#caa15a!important;color:#191713!important;border-color:#caa15a!important}
</style></head><body><main class="covenant-page"><section class="simulator-panel" aria-label="비밀계약 선택"><div class="section-heading"><h3>비밀계약 선택</h3><span id="selected-contract-name" class="muted-text"></span></div><div id="contract-grid" class="contract-grid" aria-label="비밀계약 목록"></div><div id="contract-preview"></div><div class="contract-picker-actions"><button type="button" id="equip-contract" class="primary-action" disabled>장착</button><button type="button" id="remove-contract" class="ghost-action">해제</button></div></section></main><script type="module" src="contract-picker.js"></script></body></html>
