<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages/covenant_simulator.css"><link rel="stylesheet" href="css/responsive.css"><title>비밀계약 선택</title><style>body{margin:0;background:#222}main{padding:1rem;min-width:0}.contract-grid{max-height:40dvh}.contract-picker-parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,5rem),1fr));gap:.5rem}.contract-picker-parts figure{margin:0;text-align:center}.contract-picker-parts img{width:100%;max-width:5rem;height:5rem;object-fit:contain}.contract-picker-actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1rem}button{min-height:44px}#contract-preview{margin-top:1rem}p{overflow-wrap:anywhere}
