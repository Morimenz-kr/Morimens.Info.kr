<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>보유 현황 · 성장 관리 프리뷰</title>
<link rel="icon" href="images/smile_Ramona.webp"><link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/pages/inventory_checker.css">
<link rel="stylesheet" href="css/pages/roster-preview.css"><link rel="stylesheet" href="css/pages/roster-classic.css">
<script src="js/character-identity.js" defer></script><script src="js/search_utils.js" defer></script>
<script src="js/roster-model.js" defer></script><script src="js/roster-preview.js" defer></script>
</head>
<body class="roster-app classic-roster"><div class="bg-image"></div><div class="classic-overlay"></div>
<main id="main" class="roster-shell">
<nav class="classic-back" aria-label="페이지 탐색"><a href="index.html" class="back-link">← 돌아가기</a></nav>
<section class="inventory-shell">
<header class="inventory-summary"><div><h1>각성체 / 명륜 보유 현황</h1><p id="account-summary" class="sr-only"></p></div><div class="summary-counts"><span>각성체 <strong id="character-total">0</strong></span><span>명륜 <strong id="wheel-total">0</strong></span></div></header>
<div class="classic-tabs-row"><nav class="page-tabs" aria-label="보유 현황 메뉴"><button data-tab="characters" aria-current="page">각성체</button><button data-tab="wheels">명륜</button><button data-tab="teams">추천 조합</button></nav><div class="capture-actions"><button id="copy-image" class="primary-action">이미지 복사</button><button id="preview-image-button">미리보기</button><button id="clear-account">전체 초기화</button></div></div>
<section id="inventory-panel" aria-label="보유 목록">
<div class="search-wrap"><label class="sr-only" for="search">이름 검색</label><input id="search" type="search" placeholder="이름 검색..."></div>
<div class="classic-filters"><div class="segmented" id="group-filters" aria-label="각성체 분류"><button data-group="all" aria-pressed="true">전체</button><button data-group="standard" aria-pressed="false">통상</button><button data-group="forgotten" aria-pressed="false">망각편</button><button data-group="celestial" aria-pressed="false">성신편</button></div><div class="segmented" id="role-filters" aria-label="역할"><button data-role="all" aria-pressed="true">전체 역할</button><button data-role="assault" aria-pressed="false">공격형</button><button data-role="warden" aria-pressed="false">방어형</button><button data-role="chorus" aria-pressed="false">보조형</button></div><div class="segmented" id="wheel-filters" hidden aria-label="명륜 등급"><button data-grade="all" aria-pressed="true">전체</button><button data-grade="SSR" aria-pressed="false">SSR</button><button data-grade="SR" aria-pressed="false">SR</button><button data-grade="R" aria-pressed="false">R</button></div><div class="classic-bulk"><button id="register-visible">검색 결과 선택</button><button id="unregister-visible">검색 결과 해제</button></div></div>
<div class="classic-tools"><button id="bulk-toggle">일괄 편집</button><details id="more-tools"><summary>추가 도구</summary><div class="tool-menu"><button id="presets-button">성장 프리셋 관리</button><button id="backup-button">백업·불러오기</button><button id="demo-button">데모 계정 체험</button><label>보유 여부 <select id="owned-filter"><option value="all">전체</option><option value="owned">보유</option><option value="missing">미보유</option></select></label><label>영역 <select id="realm"><option value="all">전체 영역</option><option value="chaos">혼돈</option><option value="aequor">심해</option><option value="caro">혈육</option><option value="ultra">초차원</option></select></label><label><input id="incomplete" type="checkbox"> 성장 데이터 없음</label><label>정렬 <select id="sort"><option value="default">기본 순서</option><option value="name">이름순</option><option value="potency">돌파 높은 순</option></select></label></div></details><span id="save-state" hidden></span></div>
<div class="list-meta"><p id="result-count"></p><span id="selection-tools" hidden><button id="select-visible">검색 결과를 편집 대상으로</button><button id="select-owned">보유 전체 선택</button><button id="clear-selected">선택 해제</button></span></div>
<div id="inventory-grid" class="character-grid"></div>
</section>
<section id="teams-panel" hidden aria-label="추천 조합">
<div class="team-intro"><div><h2>추천 조합</h2></div><span class="demo-label">데모</span></div>
<div class="segmented team-view-switch" aria-label="추천 정보 종류"><button id="show-team-list" aria-pressed="true">조합 찾기</button><button id="show-team-stats" aria-pressed="false">채용 통계</button></div><div class="team-filters"><label>파 <select id="team-wave"><option value="all">전체 파</option><option value="1">1파</option><option value="2">2파</option><option value="3">3파</option><option value="4">4파</option><option value="5">5파</option></select></label><label>반드시 포함 <select id="team-include"><option value="">전체 각성체</option></select></label><label>제외 <select id="team-exclude"><option value="">없음</option></select></label><label><input type="checkbox" id="team-owned"> 보유 조합만</label><label><input type="checkbox" id="team-support"> 지원 1명 허용</label><button id="reset-teams">조건 초기화</button></div>
<div id="team-stats" hidden></div><p id="team-summary" class="list-meta"></p><div id="team-grid" class="team-grid"></div>
</section>

</section></main>
<aside id="bulk-bar" hidden aria-label="일괄 편집 작업"><div><strong id="bulk-count">0명 선택</strong><span id="hidden-selection" class="muted"></span></div><div><button id="bulk-register">보유 등록</button><button id="bulk-unregister">보유 해제</button><button class="primary" id="bulk-edit">성장값 적용</button><button id="bulk-cancel">완료</button></div></aside>
<div id="toast" class="toast" role="status" hidden><span id="toast-message"></span><button id="undo-button" hidden>되돌리기</button><button id="dismiss-toast" aria-label="알림 닫기">×</button></div>
<dialog id="editor" aria-label="성장 정보 편집"><form id="editor-form"><header class="dialog-heading"><div id="editor-title"></div><button type="button" data-close aria-label="편집 닫기">×</button></header><div id="editor-body" class="dialog-body"></div><footer class="dialog-footer"><button type="button" data-close>취소</button><button type="submit" class="primary" id="editor-submit">저장</button></footer></form></dialog>
<dialog id="utility" aria-labelledby="utility-title"><header class="dialog-heading"><h2 id="utility-title"></h2><button data-close aria-label="창 닫기">×</button></header><div id="utility-body" class="dialog-body"></div></dialog>
<noscript>보유 현황 프리뷰를 사용하려면 JavaScript를 켜주세요.</noscript>
</body></html>
