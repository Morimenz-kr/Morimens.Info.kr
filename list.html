<!DOCTYPE html>
<html lang="ko">

<head>
    <link rel="icon" type="image/webp" href="images/smile_Ramona.webp">
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>각성체 목록</title>

    <script src="config/config.js"></script>
    <script>
        CONFIG.ASSET_REVISION += '-character-catalog-ui-1';
        loadCSS('css/common.css');
        loadCSS('css/components.css');
        loadCSS('css/character-catalog.css');
        loadCSS('css/pages/list.css');
        loadCSS('css/responsive.css');
        loadJS('js/feedback.js');
    </script>
</head>

<body>
<div class="bg-image"></div>
<div class="background-overlay"></div>
<main class="container inventory-page">
    <div class="header-area">
        <nav aria-label="탐색"><a href="index.html" class="back-link">← 돌아가기</a></nav>
    </div>
    <section class="inventory-shell" aria-labelledby="catalog-title">
        <div class="inventory-summary">
            <h1 id="catalog-title">각성체 정보</h1>
            <div class="summary-counts" aria-live="polite"><span>각성체 <strong id="catalog-count">불러오는 중</strong></span></div>
        </div>
        <section class="checker-controls" aria-label="검색 및 필터">
            <input type="search" id="search-bar" class="search-bar" placeholder="이름 검색..." aria-label="캐릭터 이름 검색">
            <div id="grade-filters" class="filter-pills" role="group" aria-label="등급 필터"></div>
            <div id="relems-filters" class="filter-pills" role="group" aria-label="계역 필터"></div>
            <div id="class-filters" class="filter-pills" role="group" aria-label="역할 필터"></div>
        </section>
        <section class="inventory-grid character-inventory-grid" id="character-grid" aria-label="캐릭터 목록"></section>
    </section>
</main>

<script src="js/character-catalog-ui.js?v=catalog-ui-1"></script>
<script src="js/search_utils.js"></script>
<script src="js/summon-classification.js?v=release-type-236"></script>
<script src="js/index.js?v=catalog-ui-1"></script>


<button class="floating-report-btn" title="버그 신고" aria-label="버그 제보하기">
    <span aria-hidden="true">🚨</span>
</button>
</body>
</html>
