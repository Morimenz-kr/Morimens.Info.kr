<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>실전 기록 · Morimens.Info.kr</title>
    <link rel="icon" href="images/smile_Ramona.webp" type="image/webp">
    <script src="config/config.js"></script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/records.css">
    <script defer src="js/record-features.js"></script>
    <script defer src="js/relic-features.js"></script>
    <script defer src="js/record-feature-client.js"></script>
    <script defer src="js/record-catalog-client.js"></script>
    <script defer src="js/record-integration.js"></script>
    <script defer src="js/record-build-share.js"></script>
    <script defer src="js/record-demo.js"></script>
    <script defer src="js/records-page.js"></script>
</head>
<body>
<a class="records-skip" href="#record-content">본문으로 이동</a>
<main class="records-shell">
    <header class="records-header">
        <a href="index.html">홈으로 돌아가기</a>
        <h1>실전 기록</h1>
        <p>클리어를 찾고, 당시 빌드를 확인하고, 내 파티에서 실험하세요.</p>
        <form id="profile-search" class="records-actions">
            <label>플레이어 UID <input id="profile-uid" inputmode="numeric" pattern="[1-9][0-9]{0,17}" required placeholder="UID 입력"></label>
            <button class="btn btn-yellow" type="submit">프로필 조회</button>
            <button class="btn" type="button" id="open-demo">데모 체험</button>
        </form>
        <form id="replay-search" class="records-actions">
            <label>리플레이 코드 <input id="replay-code" required placeholder="공유 코드 붙여넣기" aria-label="리플레이 코드" pattern="[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}(#E#[a-z])?"></label>
            <button type="submit">기록 빌드·분석 조회</button>
        </form>
        <details><summary>최근 조회</summary><div id="recent-profiles"></div><p>이 브라우저에만 저장됩니다. 각 항목을 삭제할 수 있습니다.</p></details>
    </header>
    <nav class="records-nav" aria-label="실전 정보 메뉴">
        <a href="?view=home">시작하기</a>
        <a href="?view=clears">클리어 검색</a><a href="?view=meta">채용 통계</a><a href="?view=leaderboard">랭킹</a>
        <a href="?view=events">이벤트</a><a href="?view=relics">전체 유물 도감</a><a href="?view=about">출처·업데이트</a>
    </nav>
    <p id="record-status" role="status" aria-live="polite"></p>
    <section id="record-content" tabindex="-1" aria-label="조회 결과"></section>
</main>
</body>
</html>
