<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조합 추천 | 미사그 대학 제국 캠퍼스</title>
    <link rel="icon" type="image/webp" href="images/smile_Ramona.webp">
    <script src="config/config.js"></script>
    <script>
        loadCSS('css/common.css');
        loadCSS('css/components.css');
        loadCSS('css/pages/team_recommendations.css');
        loadJS('js/feedback.js');
    </script>
</head>
<body>
<div class="bg-image"></div>
<div class="background-overlay"></div>

<main class="team-recommendations-page">
    <header class="team-recommendations-header">
        <a href="index.html" class="team-recommendations-back">← 메뉴로 돌아가기</a>
        <div>
            <p class="team-recommendations-eyebrow">COMMUNITY TEAM ARCHIVE</p>
            <h1>조합 추천</h1>
            <p>각성체와 장비 구성을 확인하고, 직접 사용하는 조합을 등록할 수 있습니다.</p>
        </div>
    </header>

    <div class="team-recommendations-tabs" role="tablist" aria-label="조합 추천 메뉴">
        <button type="button" class="active" role="tab" aria-selected="true" data-team-tab="browse">조합 둘러보기</button>
        <button type="button" role="tab" aria-selected="false" data-team-tab="create">조합 등록하기</button>
    </div>

    <section id="team-browse-panel" class="team-panel active" role="tabpanel">
        <div class="team-toolbar">
            <label class="team-search">
                <span class="sr-only">각성체 이름 검색</span>
                <input type="search" id="team-search-input" placeholder="각성체 이름으로 검색">
            </label>
            <label class="team-owned-filter">
                <input type="checkbox" id="team-owned-only">
                <span>보유 현황으로 구성 가능한 조합만</span>
            </label>
        </div>
        <p id="team-result-summary" class="team-result-summary" aria-live="polite"></p>
        <p class="team-inventory-scope">구성 가능 여부는 보유 현황에 등록된 각성체·돌파·명륜을 기준으로 합니다. 비밀계약 보유 여부는 현재 판정하지 않습니다.</p>
        <div id="team-list" class="community-team-list"></div>
    </section>

    <section id="team-create-panel" class="team-panel" role="tabpanel" hidden>
        <div class="team-create-intro">
            <div>
                <h2>추천 조합 등록</h2>
                <p>모든 항목은 사이트 데이터에서 선택됩니다. 동일한 조합은 자동으로 걸러집니다.</p>
            </div>
            <span>각성체 4명 필수</span>
        </div>
        <form id="team-create-form">
            <div id="team-editor-members" class="team-editor-members"></div>
            <div class="team-submit-area">
                <p id="team-submit-status" aria-live="polite"></p>
                <button type="submit" class="team-submit-button">조합 등록하기</button>
            </div>
        </form>
    </section>
</main>

<script>loadJS('js/team_recommendations.js');</script>
</body>
</html>
