<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조합 추천 | 미사그 대학 제국 캠퍼스</title>
    <link rel="icon" type="image/webp" href="images/smile_Ramona.webp">
    <script src="config/config.js"></script>
    <script>
        loadCSS('css/common.css');
        loadCSS('css/components.css');
        loadCSS('css/pages/info_tools.css');
        loadCSS('css/pages/team_recommendations.css');
        loadJS('js/feedback.js');
    </script>
</head>
<body>
<div class="bg-image"></div>
<div class="background-overlay"></div>

<main id="main-content" class="container info-page team-recommendations-page">
    <nav aria-label="탐색"><a href="index.html" class="back-link">← 뒤로가기</a></nav>
    <section class="info-shell">
        <header class="info-header team-recommendations-header">
            <div>
                <p class="info-eyebrow">RECOMMENDED TEAM GUIDE</p>
                <h1>조합 추천</h1>
                <p>추천 조합과 각성체별 돌파·명륜·비밀계약 세팅을 확인해 보세요.</p>
            </div>
        </header>

    <section id="team-browse-panel" class="team-panel active" role="tabpanel">
        <div class="team-toolbar">
            <label class="team-search">
                <span class="sr-only">각성체 이름 검색</span>
                <input type="search" id="team-search-input" placeholder="각성체 이름으로 검색">
            </label>
            <label class="team-owned-filter">
                <input type="checkbox" id="team-owned-only">
                <span>보유 현황으로 구성 가능한 조합만</span>
            </label>
        </div>
        <p id="team-result-summary" class="team-result-summary" aria-live="polite"></p>
        <p class="team-inventory-scope">구성 가능 여부는 보유 현황에 등록된 각성체·돌파·명륜을 기준으로 합니다. 비밀계약 보유 여부는 현재 판정하지 않습니다.</p>
        <div id="team-list" class="community-team-list"></div>
    </section>

</section>
</main>

<script src="js/team_recommendations.js?v=20260806-1"></script>
</body>
</html>
